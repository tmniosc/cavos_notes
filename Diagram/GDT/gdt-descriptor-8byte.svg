<svg width="100%" viewBox="0 0 760 168" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="380" y="22" text-anchor="middle" class="lbl" font-size="10">one GDT entry = 8 bytes, byte 7 on the left down to byte 0 on the right</text>

<text x="86" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">7</text>
<text x="170" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">6</text>
<text x="254" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">5</text>
<text x="338" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">4</text>
<text x="464" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">3 · 2</text>
<text x="632" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">1 · 0</text>

<rect x="44" y="50" width="84" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="86" y="80" text-anchor="middle" fill="#B5D4F4" font-size="9" class="mono">base 24:31</text>

<rect x="128" y="50" width="84" height="50" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="170" y="73" text-anchor="middle" fill="#CECBF6" font-size="9" class="mono">flags</text>
<text x="170" y="87" text-anchor="middle" fill="#AFA9EC" font-size="8" class="mono">+ limit 16:19</text>

<rect x="212" y="50" width="84" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="254" y="80" text-anchor="middle" fill="#B5D4F4" font-size="9" class="mono">base 16:23</text>

<rect x="296" y="50" width="84" height="50" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="338" y="80" text-anchor="middle" fill="#F0DBAE" font-size="9.5" font-weight="600" class="mono">access</text>

<rect x="380" y="50" width="168" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="464" y="80" text-anchor="middle" fill="#B5D4F4" font-size="9" class="mono">base 0:15</text>

<rect x="548" y="50" width="168" height="50" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="632" y="80" text-anchor="middle" fill="#C6E7CC" font-size="9" class="mono">limit 0:15</text>

<text x="380" y="124" text-anchor="middle" class="lbl" font-size="9">base and limit are chopped into non-adjacent pieces — a leftover from 286 and 386 keeping backward compatibility</text>
<text x="380" y="142" text-anchor="middle" class="lbl" font-size="9">long mode ignores both for code/data; only the access byte and the flags nibble still decide anything</text>
</svg>
