<svg width="100%" viewBox="0 0 700 412" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="350" y="20" text-anchor="middle" class="lbl" font-size="10">two independent stages, in this order — an address passes through both</text>

<rect x="150" y="30" width="400" height="46" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="350" y="52" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600">logical address</text>
<text x="350" y="68" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">segment : offset</text>

<line x1="350" y1="76" x2="350" y2="102" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="150" y="102" width="400" height="52" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="350" y="124" text-anchor="middle" fill="#CECBF6" font-size="11.5" font-weight="600">SEGMENTATION — this is where the GDT works</text>
<text x="350" y="142" text-anchor="middle" fill="#AFA9EC" font-size="9">linear = segment.base + offset, then check limit and privilege</text>

<line x1="350" y1="154" x2="350" y2="180" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="150" y="180" width="400" height="46" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="350" y="202" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600">linear address</text>
<text x="350" y="218" text-anchor="middle" fill="#85B7EB" font-size="9">also called the virtual address</text>

<line x1="350" y1="226" x2="350" y2="252" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="150" y="252" width="400" height="52" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="350" y="274" text-anchor="middle" fill="#CECBF6" font-size="11.5" font-weight="600">PAGING — page tables reached through CR3</text>
<text x="350" y="292" text-anchor="middle" fill="#AFA9EC" font-size="9">walk four levels to find the frame</text>

<line x1="350" y1="304" x2="350" y2="330" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="150" y="330" width="400" height="46" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="350" y="352" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600">physical address</text>
<text x="350" y="368" text-anchor="middle" fill="#8FC79A" font-size="9">real RAM, or MMIO, or ROM</text>

<text x="350" y="396" text-anchor="middle" class="lbl" font-size="9">in long mode the base is forced to 0, so stage one only checks privilege — paging does the real work</text>
</svg>
