<svg width="100%" viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<!-- GDTR -->
<rect x="30" y="40" width="170" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="115" y="62" text-anchor="middle" fill="#D3D1C7" font-size="11.5" font-weight="600" class="mono">GDTR</text>
<text x="115" y="77" text-anchor="middle" fill="#B4B2A9" font-size="8.5">loaded once by lgdt</text>

<!-- GDTR operand -->
<rect x="30" y="110" width="44" height="36" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="52" y="132" text-anchor="middle" fill="#D3D1C7" font-size="9" class="mono">limit</text>
<rect x="74" y="110" width="126" height="36" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="137" y="132" text-anchor="middle" fill="#D3D1C7" font-size="9" class="mono">base 64-bit</text>
<text x="52" y="160" text-anchor="middle" class="lbl" font-size="8.5">2 B</text>
<text x="137" y="160" text-anchor="middle" class="lbl" font-size="8.5">8 B</text>
<text x="30" y="182" class="lbl" font-size="8.5">limit = size − 1</text>
<text x="30" y="196" class="lbl" font-size="8.5">base = where the table lives</text>

<line x1="200" y1="128" x2="244" y2="128" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- the table -->
<rect x="244" y="40" width="256" height="34" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="258" y="61" fill="#D3D1C7" font-size="10" class="mono">null descriptor</text>

<rect x="244" y="74" width="256" height="34" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="258" y="95" fill="#B5D4F4" font-size="10" class="mono">kernel code — ring 0</text>
<line x1="500" y1="91" x2="518" y2="91" class="flow" stroke-width="1.2"/>
<text x="524" y="94" class="lbl" font-size="9">CS while running in ring 0</text>

<rect x="244" y="108" width="256" height="34" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="258" y="129" fill="#B5D4F4" font-size="10" class="mono">kernel data — ring 0</text>
<line x1="500" y1="125" x2="518" y2="125" class="flow" stroke-width="1.2"/>
<text x="524" y="128" class="lbl" font-size="9">DS / SS in ring 0</text>

<rect x="244" y="142" width="256" height="34" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="258" y="163" fill="#C6E7CC" font-size="10" class="mono">user code — ring 3</text>
<line x1="500" y1="159" x2="518" y2="159" class="flow" stroke-width="1.2"/>
<text x="524" y="162" class="lbl" font-size="9">CS in ring 3</text>

<rect x="244" y="176" width="256" height="34" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="258" y="197" fill="#C6E7CC" font-size="10" class="mono">user data — ring 3</text>
<line x1="500" y1="193" x2="518" y2="193" class="flow" stroke-width="1.2"/>
<text x="524" y="196" class="lbl" font-size="9">DS / SS in ring 3</text>

<rect x="244" y="210" width="256" height="34" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="258" y="231" fill="#F0DBAE" font-size="10" class="mono">TSS descriptor</text>
<line x1="500" y1="227" x2="518" y2="227" class="flow" stroke-width="1.2"/>
<text x="524" y="230" class="lbl" font-size="9">points at the TSS: RSP0, IST</text>

<text x="380" y="272" text-anchor="middle" class="lbl" font-size="9">the first entry must be null — a selector of 0 has to be invalid, so a forgotten segment register faults</text>
<text x="380" y="288" text-anchor="middle" class="lbl" font-size="9">in long mode base and limit are ignored for code/data; the entry still carries ring and the L flag</text>
</svg>
