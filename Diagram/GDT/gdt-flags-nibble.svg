<svg width="100%" viewBox="0 0 560 158" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="280" y="22" text-anchor="middle" class="lbl" font-size="10">flags nibble — high 4 bits of byte 6: segment size and long mode</text>

<text x="72" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">3</text>
<text x="117" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">2</text>
<text x="162" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">1</text>
<text x="207" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">0</text>

<rect x="50" y="50" width="45" height="42" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="72" y="76" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600" class="mono">G</text>
<rect x="95" y="50" width="45" height="42" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="117" y="76" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600" class="mono">D/B</text>
<rect x="140" y="50" width="45" height="42" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="162" y="76" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600" class="mono">L</text>
<rect x="185" y="50" width="45" height="42" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="207" y="76" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600" class="mono">AVL</text>

<text x="248" y="62" class="lbl" font-size="9">G — limit counted in bytes (0) or 4 KiB units (1)</text>
<text x="248" y="76" class="lbl" font-size="9">D/B — 16-bit (0) or 32-bit (1) segment</text>
<text x="248" y="90" class="lbl" font-size="9">L — 1 marks a 64-bit code segment</text>

<text x="280" y="126" text-anchor="middle" class="lbl" font-size="9">L and D/B cannot both be 1 — a 64-bit code segment must have D/B = 0</text>
<text x="280" y="142" text-anchor="middle" class="lbl" font-size="9">AVL is left for the OS; the CPU never reads it</text>
</svg>
