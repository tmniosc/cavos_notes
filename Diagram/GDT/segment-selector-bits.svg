<svg width="100%" viewBox="0 0 620 218" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="310" y="22" text-anchor="middle" class="lbl" font-size="10">segment selector — the 16-bit value you load into CS, DS, SS…</text>

<text x="225" y="46" text-anchor="middle" class="lbl mono" font-size="8.5">15 .. 3</text>
<text x="420" y="46" text-anchor="middle" class="lbl mono" font-size="8.5">2</text>
<text x="495" y="46" text-anchor="middle" class="lbl mono" font-size="8.5">1 0</text>

<rect x="60" y="52" width="330" height="46" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="225" y="72" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">Index</text>
<text x="225" y="88" text-anchor="middle" fill="#85B7EB" font-size="8.5">13 bits — which entry of the table</text>

<rect x="390" y="52" width="60" height="46" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="420" y="72" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">TI</text>
<text x="420" y="88" text-anchor="middle" fill="#D8A54A" font-size="8.5">table</text>

<rect x="450" y="52" width="90" height="46" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="495" y="72" text-anchor="middle" fill="#C6E7CC" font-size="11" font-weight="600" class="mono">RPL</text>
<text x="495" y="88" text-anchor="middle" fill="#8FC79A" font-size="8.5">2 bits</text>

<text x="60" y="126" class="lbl" font-size="9">Index × 8 = byte offset into the table — entries are 8 bytes, so the low 3 bits are free for TI and RPL</text>
<text x="60" y="144" class="lbl" font-size="9">TI = 0 selects the GDT, TI = 1 selects the LDT</text>
<text x="60" y="162" class="lbl" font-size="9">RPL = requested privilege level, checked against the descriptor's DPL</text>

<text x="310" y="196" text-anchor="middle" class="lbl mono" font-size="9">kernel CS = 0x08 → index 1, TI 0, RPL 0</text>
</svg>
