<svg width="100%" viewBox="0 0 620 168" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="310" y="22" text-anchor="middle" class="lbl" font-size="10">access byte — byte 4 of the descriptor, the one you look up most often</text>

<text x="72" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">7</text>
<text x="140" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">6 5</text>
<text x="207" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">4</text>
<text x="252" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">3</text>
<text x="297" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">2</text>
<text x="342" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">1</text>
<text x="387" y="44" text-anchor="middle" class="lbl mono" font-size="8.5">0</text>

<rect x="50" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="72" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">P</text>
<rect x="95" y="50" width="90" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="140" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">DPL</text>
<rect x="185" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="207" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">S</text>
<rect x="230" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="252" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">E</text>
<rect x="275" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="297" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">DC</text>
<rect x="320" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="342" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">RW</text>
<rect x="365" y="50" width="45" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="387" y="76" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">A</text>

<text x="426" y="66" class="lbl" font-size="9">P present · DPL = ring</text>
<text x="426" y="80" class="lbl" font-size="9">S = 1 → code/data</text>
<text x="426" y="94" class="lbl" font-size="9">E = 1 → code segment</text>

<text x="50" y="122" class="lbl mono" font-size="9">10011010 → kernel code: P=1, DPL=0, S=1, E=1, RW=1</text>
<text x="50" y="140" class="lbl mono" font-size="9">11110010 → user data:   P=1, DPL=3, S=1, E=0, RW=1</text>
</svg>
