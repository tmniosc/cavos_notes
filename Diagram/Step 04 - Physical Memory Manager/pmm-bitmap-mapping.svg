<svg width="100%" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="40" y="26" class="lbl" font-size="10">physical memory map — one entry per region, reported by the bootloader</text>

<rect x="40" y="36" width="150" height="46" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="115" y="64" text-anchor="middle" fill="#C6E7CC" font-size="9.5" font-weight="600">USABLE</text>

<rect x="190" y="36" width="80" height="46" fill="#5A2626" stroke="#D98A8A" stroke-width="1"/>
<text x="230" y="64" text-anchor="middle" fill="#F0C9C9" font-size="9.5" font-weight="600">RESERVED</text>

<rect x="270" y="36" width="230" height="46" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="385" y="58" text-anchor="middle" fill="#C6E7CC" font-size="9.5" font-weight="600">USABLE</text>
<text x="385" y="73" text-anchor="middle" fill="#8FC79A" font-size="8.5">the bitmap itself is stored in here</text>

<rect x="500" y="36" width="110" height="46" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="555" y="64" text-anchor="middle" fill="#B5D4F4" font-size="9.5" font-weight="600">KERNEL</text>

<rect x="610" y="36" width="110" height="46" fill="#5A2626" stroke="#D98A8A" stroke-width="1"/>
<text x="665" y="64" text-anchor="middle" fill="#F0C9C9" font-size="9.5" font-weight="600">FRAMEBUFFER</text>

<!-- mapping arrows -->
<line x1="115" y1="82" x2="115" y2="146" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="230" y1="82" x2="230" y2="146" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="385" y1="82" x2="385" y2="146" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="555" y1="82" x2="555" y2="146" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="665" y1="82" x2="665" y2="146" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<text x="40" y="140" class="lbl" font-size="10">bitmap — one bit per 4 KiB frame</text>

<rect x="40" y="146" width="150" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="115" y="168" text-anchor="middle" fill="#D3D1C7" font-size="10" class="mono">0 0 0 0 0 0</text>
<text x="115" y="182" text-anchor="middle" fill="#B4B2A9" font-size="8">free</text>

<rect x="190" y="146" width="80" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="230" y="168" text-anchor="middle" fill="#D3D1C7" font-size="10" class="mono">1 1 1</text>
<text x="230" y="182" text-anchor="middle" fill="#B4B2A9" font-size="8">used</text>

<rect x="270" y="146" width="70" height="44" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="305" y="168" text-anchor="middle" fill="#F0DBAE" font-size="10" class="mono">1 1 1</text>
<text x="305" y="182" text-anchor="middle" fill="#D8A54A" font-size="8">the bitmap</text>

<rect x="340" y="146" width="160" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="420" y="168" text-anchor="middle" fill="#D3D1C7" font-size="10" class="mono">0 0 0 0 0 0 0</text>
<text x="420" y="182" text-anchor="middle" fill="#B4B2A9" font-size="8">free — allocations come from here</text>

<rect x="500" y="146" width="110" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="555" y="168" text-anchor="middle" fill="#D3D1C7" font-size="10" class="mono">1 1</text>
<text x="555" y="182" text-anchor="middle" fill="#B4B2A9" font-size="8">used</text>

<rect x="610" y="146" width="110" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="665" y="168" text-anchor="middle" fill="#D3D1C7" font-size="10" class="mono">1 1</text>
<text x="665" y="182" text-anchor="middle" fill="#B4B2A9" font-size="8">used</text>

<text x="40" y="222" class="lbl" font-size="9">build order — each step overwrites the previous one, so the order matters:</text>
<text x="40" y="240" class="lbl mono" font-size="9">1. memset 0xff — assume everything is used, so address gaps stay closed forever</text>
<text x="40" y="256" class="lbl mono" font-size="9">2. clear the USABLE regions — only these become allocatable</text>
<text x="40" y="272" class="lbl mono" font-size="9">3. set the non-USABLE regions back, then mark the frames the bitmap itself occupies</text>
<text x="40" y="292" class="lbl" font-size="9">chicken and egg: the first allocator has to find room for itself before it can hand out anything</text>
</svg>
