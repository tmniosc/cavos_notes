<svg width="100%" viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="350" y="24" text-anchor="middle" class="lbl" font-size="10">every memory access the kernel makes goes through this translation</text>

<rect x="30" y="44" width="180" height="62" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="120" y="70" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600">code uses a VA</text>
<text x="120" y="88" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">0xffff800000060000</text>

<text x="248" y="68" text-anchor="middle" class="lbl" font-size="9">lookup</text>
<line x1="210" y1="75" x2="284" y2="75" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="290" y="44" width="200" height="62" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="390" y="70" text-anchor="middle" fill="#CECBF6" font-size="11.5" font-weight="600">MMU — hardware</text>
<text x="390" y="88" text-anchor="middle" fill="#AFA9EC" font-size="9">walks the page tables, root in CR3</text>

<text x="524" y="68" text-anchor="middle" class="lbl" font-size="9">result</text>
<line x1="490" y1="75" x2="558" y2="75" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="564" y="44" width="106" height="62" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="617" y="70" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600">RAM</text>
<text x="617" y="88" text-anchor="middle" fill="#8FC79A" font-size="9" class="mono">PA</text>

<text x="350" y="140" text-anchor="middle" class="lbl" font-size="9">the kernel never touches RAM directly — there is always a translation layer in between</text>
<text x="350" y="156" text-anchor="middle" class="lbl" font-size="9">that is exactly why HHDM has to exist: a ready-made VA for every physical byte</text>
</svg>
