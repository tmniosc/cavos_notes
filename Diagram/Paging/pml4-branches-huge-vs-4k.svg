<svg width="100%" viewBox="0 0 760 268" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="380" y="22" text-anchor="middle" class="lbl" font-size="10">one PML4, three branches — depth differs because the page size differs</text>

<!-- root -->
<rect x="30" y="90" width="110" height="56" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="85" y="114" text-anchor="middle" fill="#D3D1C7" font-size="11.5" font-weight="600" class="mono">PML4</text>
<text x="85" y="130" text-anchor="middle" fill="#B4B2A9" font-size="8.5">root, from CR3</text>

<!-- bus -->
<line x1="140" y1="118" x2="164" y2="118" class="flow" stroke-width="1.3"/>
<line x1="164" y1="60" x2="164" y2="212" class="flow" stroke-width="1.3"/>
<line x1="164" y1="60" x2="196" y2="60" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="164" y1="136" x2="196" y2="136" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="164" y1="212" x2="196" y2="212" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<!-- HHDM branch -->
<rect x="202" y="38" width="520" height="44" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="216" y="58" fill="#C6E7CC" font-size="10.5" font-weight="600" class="mono">[256] HHDM</text>
<text x="216" y="74" fill="#8FC79A" font-size="9" class="mono">PDPT -&gt; PD -&gt;(PS=1) 2 MiB page — three levels, no PT at all</text>
<text x="712" y="58" text-anchor="end" fill="#8FC79A" font-size="9">huge pages</text>

<!-- kernel branch -->
<rect x="202" y="114" width="520" height="44" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="216" y="134" fill="#B5D4F4" font-size="10.5" font-weight="600" class="mono">[511] kernel</text>
<text x="216" y="150" fill="#85B7EB" font-size="9" class="mono">PDPT -&gt; PD -&gt; PT -&gt; 4 KiB page — four levels</text>
<text x="712" y="134" text-anchor="end" fill="#85B7EB" font-size="9">fine-grained W^X</text>

<!-- test branch -->
<rect x="202" y="190" width="520" height="44" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="216" y="210" fill="#CECBF6" font-size="10.5" font-weight="600" class="mono">[192] test mapping</text>
<text x="216" y="226" fill="#AFA9EC" font-size="9" class="mono">PDPT -&gt; PD -&gt; PT -&gt; 4 KiB page — four levels</text>
<text x="712" y="210" text-anchor="end" fill="#AFA9EC" font-size="9">built by vmap</text>

<text x="380" y="258" text-anchor="middle" class="lbl" font-size="9">a 2 MiB page covers 512× more with one entry — cheap for mapping all of RAM, too coarse for per-section permissions</text>
</svg>
