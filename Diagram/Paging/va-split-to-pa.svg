<svg width="100%" viewBox="0 0 760 306" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="60" y="28" class="lbl" font-size="10">virtual address — 48 bits split into five fields</text>

<!-- VA fields -->
<rect x="60" y="38" width="110" height="42" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="115" y="58" text-anchor="middle" fill="#B5D4F4" font-size="10.5" font-weight="600" class="mono">PML4i</text>
<text x="115" y="72" text-anchor="middle" fill="#85B7EB" font-size="8.5" class="mono">47:39</text>

<rect x="170" y="38" width="110" height="42" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="225" y="58" text-anchor="middle" fill="#B5D4F4" font-size="10.5" font-weight="600" class="mono">PDPTi</text>
<text x="225" y="72" text-anchor="middle" fill="#85B7EB" font-size="8.5" class="mono">38:30</text>

<rect x="280" y="38" width="110" height="42" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="335" y="58" text-anchor="middle" fill="#B5D4F4" font-size="10.5" font-weight="600" class="mono">PDi</text>
<text x="335" y="72" text-anchor="middle" fill="#85B7EB" font-size="8.5" class="mono">29:21</text>

<rect x="390" y="38" width="110" height="42" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="445" y="58" text-anchor="middle" fill="#B5D4F4" font-size="10.5" font-weight="600" class="mono">PTi</text>
<text x="445" y="72" text-anchor="middle" fill="#85B7EB" font-size="8.5" class="mono">20:12</text>

<rect x="500" y="38" width="200" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="600" y="58" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">offset</text>
<text x="600" y="72" text-anchor="middle" fill="#D8A54A" font-size="8.5" class="mono">11:0 — 12 bits</text>

<!-- four indexes fan into the walk -->
<line x1="115" y1="80" x2="115" y2="104" class="flow" stroke-width="1.4"/>
<line x1="225" y1="80" x2="225" y2="104" class="flow" stroke-width="1.4"/>
<line x1="335" y1="80" x2="335" y2="104" class="flow" stroke-width="1.4"/>
<line x1="445" y1="80" x2="445" y2="104" class="flow" stroke-width="1.4"/>
<line x1="115" y1="104" x2="445" y2="104" class="flow" stroke-width="1.4"/>
<line x1="280" y1="104" x2="280" y2="136" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="130" y="136" width="300" height="46" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="280" y="157" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600">four table lookups</text>
<text x="280" y="173" text-anchor="middle" fill="#AFA9EC" font-size="8.5" class="mono">PML4 -&gt; PDPT -&gt; PD -&gt; PT</text>

<!-- elbow from walk result into the PFN cell -->
<line x1="280" y1="182" x2="280" y2="206" class="flow" stroke-width="1.4"/>
<line x1="280" y1="206" x2="350" y2="206" class="flow" stroke-width="1.4"/>
<line x1="350" y1="206" x2="350" y2="232" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- offset passes straight through -->
<line x1="600" y1="80" x2="600" y2="232" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="614" y="150" class="lbl" font-size="9">copied verbatim,</text>
<text x="614" y="164" class="lbl" font-size="9">never translated</text>

<!-- PA -->
<text x="60" y="228" class="lbl" font-size="10">physical address</text>
<rect x="200" y="232" width="300" height="42" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="350" y="252" text-anchor="middle" fill="#C6E7CC" font-size="10.5" font-weight="600" class="mono">PFN 0x0FFB2</text>
<text x="350" y="266" text-anchor="middle" fill="#8FC79A" font-size="8.5">which 4 KiB frame</text>

<rect x="500" y="232" width="200" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="600" y="252" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">offset</text>
<text x="600" y="266" text-anchor="middle" fill="#D8A54A" font-size="8.5">same 12 bits as above</text>

<text x="380" y="296" text-anchor="middle" class="lbl" font-size="9">the untranslated 12 bits are exactly why a page is 4 KiB — 2^12 bytes addressable inside one frame</text>
</svg>
