<svg width="100%" viewBox="0 0 760 496" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="380" y="20" text-anchor="middle" class="lbl" font-size="10">one address translation = four table reads, each one physical memory access</text>

<!-- CR3 -->
<rect x="230" y="32" width="300" height="50" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="380" y="54" text-anchor="middle" fill="#D3D1C7" font-size="11.5" font-weight="600" class="mono">CR3 = 0x1000</text>
<text x="380" y="71" text-anchor="middle" fill="#B4B2A9" font-size="9">register holding the root table address</text>
<line x1="380" y1="82" x2="380" y2="104" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- PML4 -->
<rect x="230" y="104" width="300" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="380" y="126" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600" class="mono">PML4 @0x1000</text>
<text x="380" y="143" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">entry[1] -&gt; 0x2000</text>
<text x="548" y="128" class="lbl mono" font-size="9">index from VA[47:39]</text>
<line x1="380" y1="154" x2="380" y2="176" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- PDPT -->
<rect x="230" y="176" width="300" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="380" y="198" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600" class="mono">PDPT @0x2000</text>
<text x="380" y="215" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">entry[2] -&gt; 0x3000</text>
<text x="548" y="200" class="lbl mono" font-size="9">index from VA[38:30]</text>
<line x1="380" y1="226" x2="380" y2="248" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- PD -->
<rect x="230" y="248" width="300" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="380" y="270" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600" class="mono">PD @0x3000</text>
<text x="380" y="287" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">entry[3] -&gt; 0x4000</text>
<text x="548" y="272" class="lbl mono" font-size="9">index from VA[29:21]</text>
<line x1="380" y1="298" x2="380" y2="320" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- PT -->
<rect x="230" y="320" width="300" height="58" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="380" y="342" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600" class="mono">PT @0x4000</text>
<text x="380" y="359" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">entry[4] -&gt; PFN 0x0FFB2 · R X</text>
<text x="380" y="373" text-anchor="middle" fill="#85B7EB" font-size="8.5">the leaf entry is where permissions live</text>
<text x="548" y="344" class="lbl mono" font-size="9">index from VA[20:12]</text>
<line x1="380" y1="378" x2="380" y2="400" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- frame -->
<rect x="250" y="400" width="260" height="50" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="380" y="422" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600" class="mono">frame 0x0FFB2</text>
<text x="380" y="439" text-anchor="middle" fill="#8FC79A" font-size="9">4 KiB of real memory</text>

<text x="380" y="478" text-anchor="middle" class="lbl" font-size="9">the TLB caches the finished result — without it every access would cost five reads instead of one</text>
</svg>
