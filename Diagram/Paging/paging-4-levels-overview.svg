<svg width="100%" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="380" y="26" text-anchor="middle" class="lbl" font-size="10">the shape to memorise: at most four levels, CR3 holds the root</text>

<rect x="25" y="44" width="100" height="50" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="75" y="68" text-anchor="middle" fill="#D3D1C7" font-size="11" font-weight="600" class="mono">CR3</text>
<text x="75" y="84" text-anchor="middle" fill="#B4B2A9" font-size="8">a register</text>
<line x1="125" y1="69" x2="145" y2="69" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="147" y="44" width="100" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="197" y="74" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">PML4</text>
<line x1="247" y1="69" x2="267" y2="69" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="269" y="44" width="100" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="319" y="74" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">PDPT</text>
<line x1="369" y1="69" x2="389" y2="69" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="391" y="44" width="100" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="441" y="74" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">PD</text>
<line x1="491" y1="69" x2="511" y2="69" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="513" y="44" width="100" height="50" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="563" y="74" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">PT</text>
<line x1="613" y1="69" x2="633" y2="69" class="flow" stroke-width="1.3" marker-end="url(#arrow)"/>

<rect x="635" y="44" width="100" height="50" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="685" y="68" text-anchor="middle" fill="#C6E7CC" font-size="11" font-weight="600" class="mono">frame</text>
<text x="685" y="84" text-anchor="middle" fill="#8FC79A" font-size="8">4 KiB</text>

<!-- bracket over the four tables -->
<line x1="147" y1="114" x2="613" y2="114" class="tline" stroke-width="1.2"/>
<line x1="147" y1="108" x2="147" y2="114" class="tline" stroke-width="1.2"/>
<line x1="613" y1="108" x2="613" y2="114" class="tline" stroke-width="1.2"/>
<text x="380" y="132" text-anchor="middle" class="lbl" font-size="9">every table is 512 entries × 8 B = exactly one 4 KiB page</text>

<text x="380" y="160" text-anchor="middle" class="lbl" font-size="9">that is why each index is 9 bits — 2^9 = 512 — and why the PMM can hand out a page table as one plain frame</text>
<text x="380" y="182" text-anchor="middle" class="lbl" font-size="9">"four levels" is the maximum: a hugepage entry stops early and skips the levels below it</text>
</svg>
