<svg width="100%" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<!-- prerequisites -->
<rect x="26" y="30" width="132" height="46" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="92" y="50" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">verifytools</text>
<text x="92" y="66" text-anchor="middle" fill="#D8A54A" font-size="8.5">cross gcc present?</text>

<rect x="170" y="30" width="132" height="46" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="236" y="50" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">limine</text>
<text x="236" y="66" text-anchor="middle" fill="#D8A54A" font-size="8.5">fetch bootloader</text>

<rect x="314" y="30" width="132" height="46" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="380" y="50" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">uacpi</text>
<text x="380" y="66" text-anchor="middle" fill="#D8A54A" font-size="8.5">ACPI library</text>

<rect x="458" y="30" width="132" height="46" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="524" y="50" text-anchor="middle" fill="#F0DBAE" font-size="10.5" font-weight="600" class="mono">musl</text>
<text x="524" y="66" text-anchor="middle" fill="#D8A54A" font-size="8.5">libc for userland</text>

<rect x="602" y="30" width="132" height="46" fill="#5A2626" stroke="#D98A8A" stroke-width="1"/>
<text x="668" y="50" text-anchor="middle" fill="#F0C9C9" font-size="10.5" font-weight="600" class="mono">ports</text>
<text x="668" y="66" text-anchor="middle" fill="#EEC2C2" font-size="8.5">Alpine rootfs — sudo</text>

<!-- fan-in bar -->
<line x1="92" y1="76" x2="92" y2="104" class="flow" stroke-width="1.4"/>
<line x1="236" y1="76" x2="236" y2="104" class="flow" stroke-width="1.4"/>
<line x1="380" y1="76" x2="380" y2="104" class="flow" stroke-width="1.4"/>
<line x1="524" y1="76" x2="524" y2="104" class="flow" stroke-width="1.4"/>
<line x1="668" y1="76" x2="668" y2="104" class="flow" stroke-width="1.4"/>
<line x1="92" y1="104" x2="668" y2="104" class="flow" stroke-width="1.4"/>
<text x="96" y="122" class="lbl mono" font-size="9">disk_prepare</text>

<line x1="380" y1="104" x2="380" y2="140" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- build step -->
<rect x="240" y="140" width="280" height="48" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="380" y="162" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">make -C src/kernel disk</text>
<text x="380" y="178" text-anchor="middle" fill="#85B7EB" font-size="9">compile kernel, then assemble the image</text>

<line x1="380" y1="188" x2="380" y2="218" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- output -->
<rect x="280" y="218" width="200" height="48" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="380" y="240" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600" class="mono">disk.img</text>
<text x="380" y="256" text-anchor="middle" fill="#8FC79A" font-size="9">~1.9 GB whole-disk image</text>

<text x="380" y="294" text-anchor="middle" class="lbl" font-size="9">every prerequisite must pass before the kernel is built — a failure stops the whole chain</text>
</svg>
