<svg width="100%" viewBox="0 0 760 366" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<!-- compile chain -->
<rect x="20" y="24" width="140" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="90" y="44" text-anchor="middle" fill="#D3D1C7" font-size="11" font-weight="600" class="mono">kernel.c</text>
<text x="90" y="59" text-anchor="middle" fill="#B4B2A9" font-size="8.5">source you wrote</text>

<text x="183" y="40" text-anchor="middle" class="lbl mono" font-size="8.5">gcc</text>
<line x1="160" y1="46" x2="206" y2="46" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="212" y="24" width="140" height="44" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="282" y="44" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">kernel.o</text>
<text x="282" y="59" text-anchor="middle" fill="#85B7EB" font-size="8.5">not linked yet</text>

<text x="378" y="40" text-anchor="middle" class="lbl mono" font-size="8.5">ld</text>
<line x1="352" y1="46" x2="404" y2="46" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="410" y="24" width="150" height="44" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="485" y="44" text-anchor="middle" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">kernel.bin</text>
<text x="485" y="59" text-anchor="middle" fill="#85B7EB" font-size="8.5">ELF64, higher-half</text>

<!-- boot files -->
<rect x="20" y="104" width="340" height="44" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="190" y="124" text-anchor="middle" fill="#F0DBAE" font-size="11" font-weight="600">Limine boot files</text>
<text x="190" y="139" text-anchor="middle" fill="#D8A54A" font-size="8.5" class="mono">limine.conf · limine-bios.sys · BOOTX64.EFI</text>

<!-- fan-in -->
<line x1="485" y1="68" x2="485" y2="172" class="flow" stroke-width="1.4"/>
<line x1="190" y1="148" x2="190" y2="172" class="flow" stroke-width="1.4"/>
<line x1="190" y1="172" x2="485" y2="172" class="flow" stroke-width="1.4"/>
<line x1="338" y1="172" x2="338" y2="200" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- packaging -->
<rect x="188" y="200" width="300" height="48" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="338" y="221" text-anchor="middle" fill="#CECBF6" font-size="11" font-weight="600" class="mono">scripts/mkimage.sh</text>
<text x="338" y="237" text-anchor="middle" fill="#AFA9EC" font-size="8.5" class="mono">dd · parted · limine bios-install · mformat · mcopy</text>

<line x1="338" y1="248" x2="338" y2="276" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- image -->
<rect x="238" y="276" width="200" height="44" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="338" y="296" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600" class="mono">os.img</text>
<text x="338" y="311" text-anchor="middle" fill="#8FC79A" font-size="8.5">64 MiB · MBR + FAT32</text>

<text x="472" y="292" text-anchor="middle" class="lbl mono" font-size="8.5">qemu</text>
<line x1="438" y1="298" x2="506" y2="298" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<rect x="512" y="276" width="220" height="44" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="622" y="296" text-anchor="middle" fill="#D3D1C7" font-size="11" font-weight="600" class="mono">Limine -&gt; kmain</text>
<text x="622" y="311" text-anchor="middle" fill="#B4B2A9" font-size="8.5">serial output appears here</text>

<text x="380" y="336" text-anchor="middle" class="lbl" font-size="9">compiled -ffreestanding, linked with linker.ld (higher-half, W^X segments)</text>
<text x="380" y="352" text-anchor="middle" class="lbl" font-size="9">the deliverable is the disk image, not the kernel — QEMU only boots what mkimage.sh packed</text>
</svg>
