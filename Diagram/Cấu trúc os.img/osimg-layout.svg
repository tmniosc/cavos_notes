<svg width="100%" viewBox="0 0 720 348" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<text x="360" y="22" text-anchor="middle" class="lbl" font-size="10">os.img — 64 MiB whole-disk image (131072 sectors of 512 B)</text>

<!-- offsets on the left -->
<text x="86" y="52" text-anchor="end" class="lbl mono" font-size="9">offset 0</text>
<text x="86" y="94" text-anchor="end" class="lbl mono" font-size="9">512 B</text>
<text x="86" y="136" text-anchor="end" class="lbl mono" font-size="9">1 MiB</text>
<text x="86" y="290" text-anchor="end" class="lbl mono" font-size="9">64 MiB</text>

<!-- MBR -->
<rect x="96" y="36" width="560" height="42" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="112" y="55" fill="#D3D1C7" font-size="11" font-weight="600" class="mono">sector 0 — MBR</text>
<text x="112" y="70" fill="#B4B2A9" font-size="9">partition table + 0x55AA boot signature</text>

<!-- gap for BIOS stage -->
<rect x="96" y="78" width="560" height="42" fill="#5C3F0E" stroke="#D8A54A" stroke-width="1"/>
<text x="112" y="97" fill="#F0DBAE" font-size="11" font-weight="600" class="mono">sector 1..2047 — 1 MiB gap</text>
<text x="112" y="112" fill="#D8A54A" font-size="9">left empty on purpose: limine bios-install writes its stage 2 here</text>

<!-- FAT32 partition -->
<rect x="96" y="120" width="560" height="164" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="112" y="139" fill="#B5D4F4" font-size="11" font-weight="600" class="mono">sector 2048.. — partition 1: FAT32, boot flag set</text>
<text x="112" y="154" fill="#85B7EB" font-size="9">63 MiB — mtools addresses it as os.img@@1M</text>
<text x="112" y="182" fill="#85B7EB" font-size="9" class="mono">/boot/kernel.bin</text>
<text x="392" y="182" fill="#85B7EB" font-size="9">your kernel, loaded by Limine</text>
<text x="112" y="202" fill="#85B7EB" font-size="9" class="mono">/boot/limine/limine.conf</text>
<text x="392" y="202" fill="#85B7EB" font-size="9">boot menu — kernel_path</text>
<text x="112" y="222" fill="#85B7EB" font-size="9" class="mono">/boot/limine/limine-bios.sys</text>
<text x="392" y="222" fill="#85B7EB" font-size="9">used on the BIOS path</text>
<text x="112" y="242" fill="#85B7EB" font-size="9" class="mono">/EFI/BOOT/BOOTX64.EFI</text>
<text x="392" y="242" fill="#85B7EB" font-size="9">used on the UEFI64 path</text>
<text x="112" y="262" fill="#85B7EB" font-size="9" class="mono">/EFI/BOOT/BOOTIA32.EFI</text>
<text x="392" y="262" fill="#85B7EB" font-size="9">used on the UEFI32 path</text>

<text x="360" y="312" text-anchor="middle" class="lbl" font-size="9">both boot paths end the same way: read limine.conf, load kernel.bin, jump to kmain</text>
<text x="360" y="330" text-anchor="middle" class="lbl" font-size="9">mtools writes into the partition without mounting it — no sudo, works in WSL2</text>
</svg>
