<svg width="100%" viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>.lbl{fill:#5c5a52;} .mono{font-family:'SF Mono',Consolas,monospace;} .tline{stroke:#c7c4ba;} .flow{ stroke:#8C8A82; }
  @media (prefers-color-scheme: dark){ .lbl{fill:#c2c0b6;} .tline{stroke:rgba(222,220,209,0.3);} .flow{stroke:#7d7b73;} }</style>
</defs>

<!-- shared base -->
<rect x="210" y="24" width="300" height="54" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="360" y="46" text-anchor="middle" fill="#D3D1C7" font-size="11.5" font-weight="600">Shared environment</text>
<text x="360" y="64" text-anchor="middle" fill="#B4B2A9" font-size="9" class="mono">WSL2 · build inside ~ · common apt packages</text>

<!-- split bus -->
<line x1="360" y1="78" x2="360" y2="104" class="flow" stroke-width="1.4"/>
<line x1="150" y1="104" x2="570" y2="104" class="flow" stroke-width="1.4"/>
<line x1="150" y1="104" x2="150" y2="142" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="570" y1="104" x2="570" y2="142" class="flow" stroke-width="1.4" marker-end="url(#arrow)"/>

<!-- cavOS branch -->
<rect x="20" y="142" width="260" height="96" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="150" y="166" text-anchor="middle" fill="#B5D4F4" font-size="11.5" font-weight="600">cavOS branch</text>
<text x="150" y="190" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">apt: bison flex gmp mpfr isl</text>
<text x="150" y="206" text-anchor="middle" fill="#85B7EB" font-size="9" class="mono">make tools -&gt; make disk -&gt; make qemu</text>
<text x="150" y="226" text-anchor="middle" fill="#85B7EB" font-size="9">read upstream code</text>

<!-- lab branch -->
<rect x="440" y="142" width="260" height="96" fill="#2C4E33" stroke="#8FC79A" stroke-width="1"/>
<text x="570" y="166" text-anchor="middle" fill="#C6E7CC" font-size="11.5" font-weight="600">oskernel-lab branch</text>
<text x="570" y="190" text-anchor="middle" fill="#8FC79A" font-size="9" class="mono">apt: mtools · Limine v8.x-binary</text>
<text x="570" y="206" text-anchor="middle" fill="#8FC79A" font-size="9" class="mono">copy source from vault -&gt; make run</text>
<text x="570" y="226" text-anchor="middle" fill="#8FC79A" font-size="9">write the code yourself</text>

<!-- caption -->
<text x="360" y="266" text-anchor="middle" class="lbl" font-size="9">no cross-compiler needed on the right — the lab boots before make tools finishes</text>
</svg>
